name: CI

# Everything this workflow runs is listed in docs/ci.md. If you add a check here,
# add it there too, so the two do not drift.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run obsolete. Cancelling matters more here than in most
# repositories: the build compiles libnghttp2 from source, so a superseded run is not merely
# noise, it is several minutes of a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Costs nothing until something fails, and when it fails on a machine you cannot attach
  # to, it is the only thing you have.
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test, clippy and docs
    # Pinned rather than `ubuntu-latest`, and the pin is load-bearing: ngtcp2's `ossl`
    # crypto backend is written against the QUIC TLS API that first shipped in OpenSSL 3.5,
    # and `ubuntu-latest` is still 24.04, which carries 3.0.13. Ubuntu 26.04 is the first
    # image with 3.5. Note that it is currently a preview image; when it becomes the
    # `ubuntu-latest` default this line can go back to the label.
    #
    # The alternative was a second job just for the QUIC crate, which would have split the
    # feature matrix across two runners for one dependency.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodule work here: the correct set is not uniform across the three
          # vendored libraries, and encoding it in two places would guarantee they drift.
          # `just submodules` below is the single definition.
          submodules: false

      - uses: extractions/setup-just@v2

      # nghttp2 and ngtcp2 want no nested submodules; nghttp3 needs exactly one of its own
      # (`lib/sfparse`, which is compiled into the library rather than into its tests).
      # The justfile encodes that asymmetry, and `just submodules-status` prints what
      # was actually checked out, which is the first thing worth seeing on a failure.
      - name: Check out the submodules the build needs
        run: |
          just submodules
          just submodules-status

      # Reads the channel and components from rust-toolchain.toml, so the pin lives in one
      # place and a contributor's local `cargo test` uses the same compiler this does.
      # Caching comes with this action, which is worth having when a cold build is dominated
      # by compiling libnghttp2 from source.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libssl-dev pkg-config
          # ngtcp2's OpenSSL backend needs >= 3.5, and a too-old one fails deep inside
          # CMake's symbol probing rather than saying so. Fail here instead, where the
          # message can name the actual requirement.
          pkg-config --atleast-version=3.5.0 openssl || {
            echo "::error::OpenSSL $(pkg-config --modversion openssl) is too old for"
            echo "::error::ngtcp2's ossl crypto backend, which needs >= 3.5.0."
            echo "::error::Has the runner image changed? See runs-on above."
            exit 1
          }
          echo "OpenSSL $(pkg-config --modversion openssl)"

      # Three genuinely different builds. The async layer sits behind a default-on feature
      # and the sans-I/O core has to stand up without it; `--all-features` additionally
      # pulls in the compio transport, which exists to show the transport traits fit a
      # completion-based runtime rather than only a readiness-based one.
      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (sans-I/O core alone)
        run: cargo test -p ngnet-h2 --no-default-features

      - name: Test (HTTP/3 sans-I/O core alone)
        run: cargo test -p ngnet-h3 --no-default-features

      # The QUIC bindings' other half of the matrix. ngtcp2 itself links no TLS, and the
      # crate promises that `--no-default-features` reflects that; the workspace runs above
      # only ever exercise it with the crypto backend on.
      - name: Test (QUIC bindings without the crypto backend)
        run: cargo test -p ngnet-quic-sys --no-default-features

      # The QUIC wrapper with no TLS backend at all. The seam is still compiled and still
      # type-checked; there is simply nothing behind it. This is the configuration that
      # catches a stray `ngtcp2_crypto_*` reference outside the feature gate, because those
      # symbols do not exist in the bindings at all when the backend is off.
      - name: Test (QUIC wrapper without a TLS backend)
        run: cargo test -p ngnet-quic --no-default-features

      # The QUIC wrapper's asynchronous layer without a TLS backend. Distinct from the run
      # above, which turns the endpoint off as well: this is the one configuration where the
      # endpoint exists but address validation cannot, because writing a Retry packet needs
      # packet protection the backend supplies. Nothing else covers it.
      - name: Test (QUIC endpoint without a TLS backend)
        run: cargo test -p ngnet-quic --no-default-features --features endpoint

      # Release matters here in a way it usually does not. ngtcp2 checks its settings and
      # transport parameters with `assert()`, and `NDEBUG` removes every one of them from a
      # release build -- so the crate performs those checks itself, and this is the run that
      # proves they hold where the C library's own no longer do.
      - name: Test (QUIC wrapper, release)
        run: cargo test -p ngnet-quic --release

      # The same argument one layer up. The interoperability suite already runs in the
      # workspace steps above; running it in release as well is where an ngtcp2 assertion
      # that would have caught a defect in debug is absent, and the defect shows up as
      # behaviour against a foreign implementation instead.
      - name: Test (HTTP/3 over ngtcp2, release)
        run: cargo test -p ngnet-quic-h3 -p ngnet-quic-h3-tests --release

      # And the same argument for the other join. libdwnx checks its own invariants with
      # ninety-odd `assert()` calls, every one of which `NDEBUG` removes from a release
      # build, so the workspace runs above and this one exercise materially different C. The
      # Rust side gains something too: the large-body and concurrency tests here move
      # megabytes through the record layer, and debug builds are slow enough that a
      # performance regression hides in the noise rather than showing up as a timeout.
      - name: Test (HTTP/3 over QMux, release)
        run: cargo test -p ngnet-qmux-h3 -p ngnet-qmux-h3-tests --release

      # Sixteen configurations that differ only in a package and its features, so they are one
      # step iterating a list rather than ten near-identical steps. The list is the whole
      # point of the step: a configuration is added by adding a line, and the reason it
      # exists is written directly above it, where a reader looking at the entry will find
      # it.
      #
      # A `strategy.matrix` would have been the other way to say this and is the wrong shape
      # here: each leg is a fresh runner, and this build compiles libnghttp2, nghttp3 and
      # ngtcp2 from source. Ten legs would mean ten cold C builds to save some repetition in
      # a YAML file.
      #
      # `--all-targets` and `-- -D warnings` are invariant across every entry and so are
      # hoisted into the loop. `--all-targets` reaches benchmarks and examples as well as
      # tests, which is half of what keeps the benchmark crate from rotting.
      #
      # `run:` executes under `bash -e`, so the first failing configuration stops the step,
      # exactly as the first failing step used to stop the job. The failure is announced by
      # name before it can be buried in a collapsed group.
      - name: Clippy across the package and feature matrix
        run: |
          while IFS='|' read -r description flags; do
            description=$(printf '%s' "$description" | sed 's/^ *//; s/ *$//')
            flags=$(printf '%s' "$flags" | sed 's/^ *//; s/ *$//')
            case "$description" in ''|'#'*) continue ;; esac

            echo "::group::clippy: $description"
            if ! cargo clippy $flags --all-targets -- -D warnings; then
              echo "::endgroup::"
              echo "::error::clippy failed for: $description"
              echo "::error::  cargo clippy $flags --all-targets -- -D warnings"
              exit 1
            fi
            echo "::endgroup::"
          done <<'CONFIGURATIONS'
          # The whole workspace with everything switched on. The only entry that is not
          # per-package, and the one that lints the test and bench crates.
          all features                             | --workspace --all-features

          # The h2 family. The async layer sits behind a default-on feature and the sans-I/O
          # core has to stand up without it, so one configuration cannot speak for both.
          default features                         | -p ngnet-h2
          sans-I/O core alone                      | -p ngnet-h2 --no-default-features

          # The h3 family, for the same reason: its async layer is behind a default-on
          # `http` feature.
          HTTP/3, default features                 | -p ngnet-h3
          HTTP/3 sans-I/O core alone               | -p ngnet-h3 --no-default-features

          # The QUIC bindings' other half of the matrix. ngtcp2 itself links no TLS, and the
          # crate promises that `--no-default-features` reflects that; the workspace entry
          # above only ever exercises it with the crypto backend on.
          QUIC bindings without the crypto backend | -p ngnet-quic-sys --no-default-features

          # The QUIC wrapper with and without a TLS backend. With none at all the seam is
          # still compiled and still type-checked; there is simply nothing behind it. That is
          # the configuration that catches a stray `ngtcp2_crypto_*` reference outside the
          # feature gate, because those symbols do not exist in the bindings when the backend
          # is off.
          QUIC wrapper, default features           | -p ngnet-quic
          QUIC wrapper without a TLS backend       | -p ngnet-quic --no-default-features

          # The asynchronous endpoint's own two. Its runtime integration is behind an
          # off-by-default feature, and the endpoint-without-a-TLS-backend configuration
          # compiles code no other entry reaches -- address validation is absent there,
          # because writing a Retry packet needs packet protection the backend supplies.
          QUIC endpoint on tokio                   | -p ngnet-quic --features tokio
          QUIC endpoint without a TLS backend      | -p ngnet-quic --no-default-features --features endpoint

          # The HTTP/3-over-ngtcp2 adapter has no feature matrix of its own: it is nothing but
          # the join between the two async layers it binds, so with either disabled it would
          # not compile. One invocation covers it.
          HTTP/3 over ngtcp2                       | -p ngnet-quic-h3

          # The QMux wrapper's three, and the reason it has three is the same one the h3
          # family has: its asynchronous layer is behind a default-on `io` feature, so the
          # sans-I/O configuration compiles code no other entry reaches -- and the crate's
          # promise is that `--no-default-features` is the state machine as it was before the
          # layer existed. The all-features entry is the one that resolves the optional tokio
          # dependency, so it is where an item gated on that feature is actually compiled.
          QMux wrapper, default features           | -p ngnet-qmux
          QMux sans-I/O core alone                 | -p ngnet-qmux --no-default-features
          QMux wrapper, all features               | -p ngnet-qmux --all-features

          # The HTTP/3-over-QMux join, for the same reason its ngtcp2 sibling gets one line:
          # it is nothing but the join between two async layers, so it has no features to
          # vary. Its integration crate rides along in the same invocation because that crate
          # keeps its harness in `src/lib.rs` rather than behind [dev-dependencies], which
          # makes it an ordinary library that `--all-targets` would otherwise lint only when
          # something else happened to build it.
          HTTP/3 over QMux                         | -p ngnet-qmux-h3 -p ngnet-qmux-h3-tests

          # `ngnet-axum` has no feature matrix -- axum, tokio and the h2 transport are all
          # unconditional -- so unlike the crates above it needs exactly one invocation
          # rather than one per configuration.
          axum integration                         | -p ngnet-axum

          # Same reasoning: `ngnet-util` has no features either -- tokio, the h2 transport
          # and the tower `Service` impl are all unconditional.
          client policy layer                      | -p ngnet-util
          CONFIGURATIONS

      # Twenty-four invocations that differ only in packages and features, collapsed the same
      # way as clippy above, and for the same reasons -- including that a `strategy.matrix`
      # would put each on its own runner and rebuild the C libraries for every one.
      #
      # `RUSTDOCFLAGS: -D warnings` is set once for the whole step and applies to every
      # entry, replacing five identical `env:` blocks. That is the behaviour being preserved:
      # a documentation warning fails the build, in any configuration.
      #
      # The feature loops that used to be written as `for features in ...` are spelled out
      # one line at a time. It is slightly longer and it is worth it: each configuration is
      # now a line that can be added, removed or read on its own, and the set CI covers can
      # be compared against this list without mentally expanding a loop.
      - name: Rustdoc across the package and feature matrix
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          while IFS='|' read -r description flags; do
            description=$(printf '%s' "$description" | sed 's/^ *//; s/ *$//')
            flags=$(printf '%s' "$flags" | sed 's/^ *//; s/ *$//')
            case "$description" in ''|'#'*) continue ;; esac

            echo "::group::cargo doc: $description"
            if ! cargo doc --no-deps $flags; then
              echo "::endgroup::"
              echo "::error::rustdoc failed for: $description"
              echo "::error::  RUSTDOCFLAGS='-D warnings' cargo doc --no-deps $flags"
              exit 1
            fi
            echo "::endgroup::"
          done <<'CONFIGURATIONS'
          # Five configurations rather than one, because of a bug this repository actually
          # shipped: a doc link to an item behind the `tokio` feature passed `--all-features`
          # and broke every build without it. `--all-features` alone is not a documentation
          # check.
          h2, default features                     | -p ngnet-h2
          h2, sans-I/O core alone                  | -p ngnet-h2 --no-default-features
          h2, all features                         | -p ngnet-h2 --all-features
          h2, tokio transport                      | -p ngnet-h2 --features tokio
          h2, completion transport                 | -p ngnet-h2 --features completion

          # `ngnet-h3` has a feature matrix of its own now that the async layer is behind a
          # default-on `http` feature: a doc link to a gated item passes under one
          # configuration and breaks the others, which is exactly the failure the h2 matrix
          # above exists for.
          h3, default features                     | -p ngnet-h3
          h3, sans-I/O core alone                  | -p ngnet-h3 --no-default-features
          h3, all features                         | -p ngnet-h3 --all-features

          # The crates with no feature matrix of their own, documented in one invocation
          # because there is no second configuration to get wrong. Kept as a single entry
          # rather than split per package, so this list maps one-to-one onto the steps it
          # replaced.
          h3 bindings, h3 tests and QUIC bindings   | -p ngnet-h3-sys -p ngnet-h3-tests -p ngnet-quic-sys

          # And the QUIC wrapper's own matrix, for the same reason as h3's: its TLS backend
          # sits behind a default-on feature, so a doc link into it breaks the configuration
          # without it.
          QUIC wrapper, default features           | -p ngnet-quic
          QUIC wrapper without a TLS backend       | -p ngnet-quic --no-default-features
          QUIC wrapper, all features               | -p ngnet-quic --all-features
          QUIC endpoint on tokio                   | -p ngnet-quic --features tokio
          QUIC endpoint without a TLS backend      | -p ngnet-quic --no-default-features --features endpoint
          QUIC tests                               | -p ngnet-quic-tests
          HTTP/3 over ngtcp2                       | -p ngnet-quic-h3
          HTTP/3-over-ngtcp2 tests                 | -p ngnet-quic-h3-tests

          # The QMux wrapper's own matrix, for the same reason as h3's: its asynchronous
          # layer sits behind a default-on `io` feature, so a doc link into it breaks the
          # configuration without it -- which is the exact bug the h2 matrix above was written
          # for.
          QMux wrapper, default features           | -p ngnet-qmux
          QMux sans-I/O core alone                 | -p ngnet-qmux --no-default-features
          QMux wrapper, all features               | -p ngnet-qmux --all-features
          HTTP/3 over QMux                         | -p ngnet-qmux-h3
          HTTP/3-over-QMux tests                   | -p ngnet-qmux-h3-tests

          # One invocation each, for the same reason as their clippy entries: no features to
          # vary.
          axum integration                         | -p ngnet-axum
          client policy layer                      | -p ngnet-util
          CONFIGURATIONS

      # The dependency-graph and linkage checks used to live here, as seven inline shell
      # steps. They are Rust tests now, in tests/ngnet-workspace-tests, and the workspace
      # test runs above pick them up with no wiring of their own. The reasoning that was in
      # these comments moved with them, into the tests' documentation.
      #
      # The point of the move is that a contributor can now ask the same questions without
      # opening a pull request:
      #
      #   cargo test -p ngnet-workspace-tests
      #
      # They assert what the resolved dependency graph contains and what the linked binaries
      # pull in -- deliberately not the same claims as the crates/*/tests/invariants.rs
      # suites, which assert what a crate declares in its manifest. See docs/ci.md.

      # Benchmarks are not run here for their numbers. A shared runner has noisy
      # neighbours, no frequency control and no guaranteed CPU model, so a timing threshold
      # would fail on scheduling luck and be muted within a fortnight — and a muted alarm
      # still costs attention. `--test` runs each benchmark once and checks it completes,
      # which catches the real risk: benchmarks are not part of `cargo test`, so they rot
      # silently as the API moves.
      #
      # Tracking performance over time needs a dedicated machine with a pinned core and
      # saved baselines. See docs/h2/benchmarks/running.md.
      - name: Benchmarks compile and run once
        run: cargo bench --workspace -- --test

# Deliberately absent: a `cargo fmt --check` gate. This repository is not globally
# rustfmt-clean, and the convention is to format only the files a change touches
# (`rustfmt --edition 2024 <file>`). A repository-wide gate would fail on every pull request
# for reasons unrelated to the change in it. Reformatting everything at once would settle
# the matter, but that is a decision to take deliberately rather than a side effect of
# adding CI.
#
# Also absent: an MSRV job, because there is no MSRV to check. No crate declares
# `rust-version`. The workspace could not honour a single minimum anyway — the benchmark
# crate's Criterion dependency and compio's buffer crate both require newer compilers than
# the rest — so the declared minimum was a claim about some crates rather than about the
# workspace. `rust-toolchain.toml` names the one toolchain everything is built with.
