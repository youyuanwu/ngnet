name: CI

# Everything this workflow runs is listed in docs/ci.md. If you add a check here,
# add it there too, so the two do not drift.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an in-flight run obsolete. Cancelling matters more here than in most
# repositories: the build compiles libnghttp2 from source, so a superseded run is not merely
# noise, it is several minutes of a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Costs nothing until something fails, and when it fails on a machine you cannot attach
  # to, it is the only thing you have.
  RUST_BACKTRACE: 1

jobs:
  ci:
    name: Test, clippy and docs
    # Pinned rather than `ubuntu-latest`, and the pin is load-bearing: ngtcp2's `ossl`
    # crypto backend is written against the QUIC TLS API that first shipped in OpenSSL 3.5,
    # and `ubuntu-latest` is still 24.04, which carries 3.0.13. Ubuntu 26.04 is the first
    # image with 3.5. Note that it is currently a preview image; when it becomes the
    # `ubuntu-latest` default this line can go back to the label.
    #
    # The alternative was a second job just for the QUIC crate, which would have split the
    # feature matrix across two runners for one dependency.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # No submodule work here: the correct set is not uniform across the three
          # vendored libraries, and encoding it in two places would guarantee they drift.
          # `just submodules` below is the single definition.
          submodules: false

      - uses: extractions/setup-just@v2

      # nghttp2 and ngtcp2 want no nested submodules; nghttp3 needs exactly one of its own
      # (`lib/sfparse`, which is compiled into the library rather than into its tests).
      # The justfile encodes that asymmetry, and `just submodules-status` prints what
      # was actually checked out, which is the first thing worth seeing on a failure.
      - name: Check out the submodules the build needs
        run: |
          just submodules
          just submodules-status

      # Reads the channel and components from rust-toolchain.toml, so the pin lives in one
      # place and a contributor's local `cargo test` uses the same compiler this does.
      # Caching comes with this action, which is worth having when a cold build is dominated
      # by compiling libnghttp2 from source.
      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libclang-dev libssl-dev pkg-config
          # ngtcp2's OpenSSL backend needs >= 3.5, and a too-old one fails deep inside
          # CMake's symbol probing rather than saying so. Fail here instead, where the
          # message can name the actual requirement.
          pkg-config --atleast-version=3.5.0 openssl || {
            echo "::error::OpenSSL $(pkg-config --modversion openssl) is too old for"
            echo "::error::ngtcp2's ossl crypto backend, which needs >= 3.5.0."
            echo "::error::Has the runner image changed? See runs-on above."
            exit 1
          }
          echo "OpenSSL $(pkg-config --modversion openssl)"

      # Three genuinely different builds. The async layer sits behind a default-on feature
      # and the sans-I/O core has to stand up without it; `--all-features` additionally
      # pulls in the compio transport, which exists to show the transport traits fit a
      # completion-based runtime rather than only a readiness-based one.
      - name: Test (all features)
        run: cargo test --workspace --all-features

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (sans-I/O core alone)
        run: cargo test -p ngnet-h2 --no-default-features

      - name: Test (HTTP/3 sans-I/O core alone)
        run: cargo test -p ngnet-h3 --no-default-features

      # The QUIC bindings' other half of the matrix. ngtcp2 itself links no TLS, and the
      # crate promises that `--no-default-features` reflects that; the workspace runs above
      # only ever exercise it with the crypto backend on.
      - name: Test (QUIC bindings without the crypto backend)
        run: cargo test -p ngnet-quic-sys --no-default-features

      # The QUIC wrapper with no TLS backend at all. The seam is still compiled and still
      # type-checked; there is simply nothing behind it. This is the configuration that
      # catches a stray `ngtcp2_crypto_*` reference outside the feature gate, because those
      # symbols do not exist in the bindings at all when the backend is off.
      - name: Test (QUIC wrapper without a TLS backend)
        run: cargo test -p ngnet-quic --no-default-features

      # Release matters here in a way it usually does not. ngtcp2 checks its settings and
      # transport parameters with `assert()`, and `NDEBUG` removes every one of them from a
      # release build -- so the crate performs those checks itself, and this is the run that
      # proves they hold where the C library's own no longer do.
      - name: Test (QUIC wrapper, release)
        run: cargo test -p ngnet-quic --release

      # `--all-targets` reaches benchmarks and examples as well as tests, which is half of
      # what keeps the benchmark crate from rotting.
      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Clippy (default features)
        run: cargo clippy -p ngnet-h2 --all-targets -- -D warnings

      - name: Clippy (sans-I/O core alone)
        run: cargo clippy -p ngnet-h2 --no-default-features --all-targets -- -D warnings

      - name: Clippy (HTTP/3, default features)
        run: cargo clippy -p ngnet-h3 --all-targets -- -D warnings

      - name: Clippy (HTTP/3 sans-I/O core alone)
        run: cargo clippy -p ngnet-h3 --no-default-features --all-targets -- -D warnings

      - name: Clippy (QUIC bindings without the crypto backend)
        run: cargo clippy -p ngnet-quic-sys --no-default-features --all-targets -- -D warnings

      - name: Clippy (QUIC wrapper, default features)
        run: cargo clippy -p ngnet-quic --all-targets -- -D warnings

      - name: Clippy (QUIC wrapper without a TLS backend)
        run: cargo clippy -p ngnet-quic --no-default-features --all-targets -- -D warnings

      # `ngnet-axum` has no feature matrix -- axum, tokio and the h2 transport are all
      # unconditional -- so unlike the crates above it needs exactly one invocation rather
      # than one per configuration.
      - name: Clippy (axum integration)
        run: cargo clippy -p ngnet-axum --all-targets -- -D warnings

      # Four configurations rather than one, because of a bug this repository actually
      # shipped: a doc link to an item behind the `tokio` feature passed `--all-features`
      # and broke every build without it. `--all-features` alone is not a documentation check.
      - name: Rustdoc across the feature matrix
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for features in "" "--no-default-features" "--all-features" "--features tokio" "--features completion"; do
            echo "::group::cargo doc ${features:-(default)}"
            cargo doc --no-deps -p ngnet-h2 $features
            echo "::endgroup::"
          done

      # `ngnet-h3` has a feature matrix of its own now that the async layer is behind a
      # default-on `http` feature: a doc link to a gated item passes under one configuration
      # and breaks the others, which is exactly the failure the h2 matrix above exists for.
      - name: Rustdoc across the HTTP/3 feature matrix
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for features in "" "--no-default-features" "--all-features"; do
            echo "::group::cargo doc -p ngnet-h3 ${features:-(default)}"
            cargo doc --no-deps -p ngnet-h3 $features
            echo "::endgroup::"
          done
          cargo doc --no-deps -p ngnet-h3-sys -p ngnet-h3-tests -p ngnet-quic-sys

      # And the QUIC wrapper's own matrix, for the same reason: its TLS backend sits behind
      # a default-on feature, so a doc link into it breaks the configuration without it.
      - name: Rustdoc across the QUIC feature matrix
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for features in "" "--no-default-features" "--all-features"; do
            echo "::group::cargo doc -p ngnet-quic ${features:-(default)}"
            cargo doc --no-deps -p ngnet-quic $features
            echo "::endgroup::"
          done
          cargo doc --no-deps -p ngnet-quic-tests

      # One invocation for the same reason as its clippy step: no features to vary.
      - name: Rustdoc for the axum integration
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps -p ngnet-axum

      # Two separate claims, and they need two separate commands.
      #
      # The first is that the sans-I/O core still stands alone. `cargo tree` resolves default
      # features, and the async layer's feature is default-on, so this must be asked with
      # `--no-default-features` or it is asking about the async layer instead. The invariants
      # test asserts what the manifest *declares*; this asserts what the resolved graph
      # actually contains, which is the thing a downstream user gets.
      #
      # The second is that no transport or TLS crate reaches the graph in *any* configuration.
      # That one is asked with default features on, because cargo unifies features across a
      # workspace and a crate added later could pull a transport in with nothing in
      # `ngnet-h3` changing.
      - name: The HTTP/3 sans-I/O core depends on nothing but its bindings
        run: |
          # `cargo tree` prints the crate itself on the first line and one line per
          # dependency after it, each prefixed with a box-drawing character. So the claim
          # "exactly one dependency" is "exactly one line after the first", and the name on
          # it has to be the right one -- counting lines alone would pass for any single
          # dependency at all.
          tree=$(cargo tree -p ngnet-h3 --no-default-features -e normal)
          echo "$tree"
          deps=$(echo "$tree" | tail -n +2)
          if [ "$(echo "$deps" | grep -c .)" != "1" ] \
             || ! echo "$deps" | grep -q 'ngnet-h3-sys'; then
            echo "::error::the HTTP/3 core's dependency graph is no longer just its bindings."
            exit 1
          fi
          echo "the HTTP/3 core still stands alone"

      - name: No transport or TLS crate reaches the HTTP/3 wrapper
        run: |
          tree=$(cargo tree -p ngnet-h3 -e normal)
          echo "$tree"
          if echo "$tree" | grep -qiE 'quinn|rustls|tokio|ring'; then
            echo "::error::a transport or TLS crate reached ngnet-h3's dependency graph."
            echo "::error::Test-only dependencies belong in ngnet-h3-tests."
            exit 1
          fi
          echo "no transport in the HTTP/3 wrapper's graph"

      # ngtcp2 links no TLS of its own; only the crypto helper does. `cargo tree` cannot
      # check that, because OpenSSL is not a cargo dependency at all — it arrives through
      # link flags this crate's build script emits. So the claim is checked where it is
      # actually observable: in the dynamic section of the linked binary.
      - name: The QUIC bindings link no TLS without the crypto backend
        run: |
          bins=$(cargo test -p ngnet-quic-sys --no-default-features --no-run \
                   --message-format=json 2>/dev/null \
                 | grep -o '"executable":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$bins" ]; then
            echo "::error::found no test binaries to inspect; did the build layout change?"
            exit 1
          fi
          found=0
          for bin in $bins; do
            echo "checking $bin"
            if readelf -d "$bin" | grep -qiE 'NEEDED.*lib(ssl|crypto)'; then
              echo "::error::$bin links OpenSSL with the crypto-ossl feature off."
              found=1
            fi
          done
          if [ "$found" != 0 ]; then exit 1; fi
          echo "no TLS in the default-off QUIC build"

      # The same claim one layer up, and the one that actually discriminates. `ngnet-quic`
      # with its TLS backend on genuinely does link OpenSSL; with it off it must not. Both
      # halves are asserted, because a guard that passes in both configurations is proving
      # nothing -- which was true of the bindings-level check above until the wrapper gave
      # it something to see.
      - name: The QUIC wrapper links TLS only when its backend is enabled
        run: |
          inspect() {
            cargo test -p ngnet-quic $1 --no-run --message-format=json 2>/dev/null               | grep -o '"executable":"[^"]*"' | cut -d'"' -f4
          }

          off=$(inspect --no-default-features)
          if [ -z "$off" ]; then
            echo "::error::found no test binaries to inspect; did the build layout change?"
            exit 1
          fi
          for bin in $off; do
            if readelf -d "$bin" | grep -qiE 'NEEDED.*lib(ssl|crypto)'; then
              echo "::error::$bin links OpenSSL with the TLS backend off."
              exit 1
            fi
          done

          on=$(inspect "")
          linked=0
          for bin in $on; do
            if readelf -d "$bin" | grep -qiE 'NEEDED.*libssl'; then linked=1; fi
          done
          if [ "$linked" != 1 ]; then
            echo "::error::no binary links libssl with the TLS backend on, so the check above proves nothing."
            exit 1
          fi
          echo "TLS is linked with the backend on and absent without it"

      # The completion transport's guarantee is that no readiness backend is compiled, so it
      # cannot silently degrade to epoll. That is a property of the resolved dependency
      # graph, not of any source file, and cargo unifies features across the whole workspace
      # — so a crate added later could enable compio's `polling` and undo it with nothing in
      # the code changing. The runtime assertion in the compio test only fires where io_uring
      # is genuinely absent, which is not here; this is the check that catches it on a host
      # that has io_uring, which is to say on this runner and on any developer's machine.
      - name: The completion transport compiles no readiness backend
        run: |
          if cargo tree -p ngnet-h2 --features completion -e features \
               | grep -q 'compio-driver feature "polling"'; then
            echo "::error::compio's polling feature reached the build, which restores the"
            echo "::error::fusion driver and its silent fallback to epoll. Find who enabled"
            echo "::error::it with: cargo tree -p ngnet-h2 --features completion -e features"
            exit 1
          fi
          echo "no readiness backend in the completion build"

      # The claim `ngnet-axum` exists to make is that an axum `Router` runs without hyper
      # underneath it. That is easy to state and easy to lose: axum has optional features
      # that pull `hyper-util` in, `ConnectInfo` among them, and enabling one in a moment of
      # convenience would quietly reinstate the dependency the crate was written to remove.
      # A reader cannot see that in a manifest, because it would arrive transitively.
      #
      # `-e normal` is the whole point of the check. hyper *is* a dev-dependency here, on
      # purpose: the acceptance tests drive the server with an independent HTTP/2 client,
      # and a client from this workspace could only show ngnet-h2 agreeing with itself. So
      # the claim is about what a downstream user links, not about what the test binaries
      # link, and only the normal graph expresses that.
      - name: No hyper crate reaches the axum integration
        run: |
          tree=$(cargo tree -p ngnet-axum -e normal)
          echo "$tree"
          if echo "$tree" | grep -qiE '\bhyper'; then
            echo "::error::a hyper crate reached ngnet-axum's normal dependency graph,"
            echo "::error::which is the one thing this crate exists to avoid. Find it with:"
            echo "::error::  cargo tree -p ngnet-axum -e normal -i hyper"
            echo "::error::The usual cause is an axum feature that depends on hyper-util."
            echo "::error::Test-only clients belong in [dev-dependencies], which this"
            echo "::error::check deliberately ignores."
            exit 1
          fi
          echo "no hyper in the axum integration's normal graph"

      # Benchmarks are not run here for their numbers. A shared runner has noisy
      # neighbours, no frequency control and no guaranteed CPU model, so a timing threshold
      # would fail on scheduling luck and be muted within a fortnight — and a muted alarm
      # still costs attention. `--test` runs each benchmark once and checks it completes,
      # which catches the real risk: benchmarks are not part of `cargo test`, so they rot
      # silently as the API moves.
      #
      # Tracking performance over time needs a dedicated machine with a pinned core and
      # saved baselines. See docs/h2/benchmarks.md.
      - name: Benchmarks compile and run once
        run: cargo bench --workspace -- --test

# Deliberately absent: a `cargo fmt --check` gate. This repository is not globally
# rustfmt-clean, and the convention is to format only the files a change touches
# (`rustfmt --edition 2024 <file>`). A repository-wide gate would fail on every pull request
# for reasons unrelated to the change in it. Reformatting everything at once would settle
# the matter, but that is a decision to take deliberately rather than a side effect of
# adding CI.
#
# Also absent: an MSRV job, because there is no MSRV to check. No crate declares
# `rust-version`. The workspace could not honour a single minimum anyway — the benchmark
# crate's Criterion dependency and compio's buffer crate both require newer compilers than
# the rest — so the declared minimum was a claim about some crates rather than about the
# workspace. `rust-toolchain.toml` names the one toolchain everything is built with.
