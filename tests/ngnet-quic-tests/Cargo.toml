[package]
name = "ngnet-quic-tests"
version = "0.1.0"
description = "Integration tests driving the ngnet-quic crate through real handshakes and real sockets"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

# This crate exists so that `ngnet-quic` can be driven through a genuine TLS handshake --
# which needs certificates, and therefore a certificate-generating dependency -- without the
# wrapper itself acquiring one. `ngnet-quic` has exactly one dependency and no
# dev-dependencies, and a test asserts as much; anything needing more belongs here.
#
# These are `[dependencies]` rather than `[dev-dependencies]` because the harness lives in
# `src/lib.rs`, and a library target cannot see dev-dependencies.
[dependencies]
# `endpoint` comes with the default features; `tokio` is asked for explicitly, because the
# asynchronous tests drive the endpoint over a real socket on a real runtime.
ngnet-quic = { workspace = true, features = ["tokio"] }
rcgen.workspace = true

# The runtime the asynchronous tests run on. A dependency of this crate rather than of
# `ngnet-quic`, which keeps its own runtime integration optional.
#
# Note that the in-process endpoint tests deliberately do *not* use it: they drive the
# layer with a hand-rolled poll loop, which is how the claim that the crate needs no
# executor is tested rather than asserted.
tokio = { workspace = true }
