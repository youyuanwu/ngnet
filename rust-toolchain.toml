# The toolchain everyone builds with, contributors and CI alike. Pinned rather than
# tracking `stable` so that a lint added by a new release lands when someone chooses to
# raise this number, not on the morning it ships — a red build nobody caused is a red
# build nobody owns.
#
# There is deliberately no declared MSRV. No crate here sets `rust-version`, and CI does not
# check one: the workspace already could not honour a single minimum — the benchmark crate's
# Criterion dependency and compio's buffer crate both require newer compilers than the rest —
# so a declared minimum was a claim about some crates rather than the workspace. Build with
# this toolchain.
#
# rustup reads this file automatically, so `cargo test` in a clone uses it with no setup.
[toolchain]
channel = "1.97.1"
components = ["clippy", "rustfmt"]
profile = "minimal"
