# The toolchain everyone builds with, contributors and CI alike. Pinned rather than
# tracking `stable` so that a lint added by a new release lands when someone chooses to
# raise this number, not on the morning it ships — a red build nobody caused is a red
# build nobody owns.
#
# This is *not* the minimum supported version. That is `rust-version` in each library
# crate's manifest (1.85). CI verifies it for the HTTP/3 crates, in a separate job that
# installs 1.85 explicitly, but not workspace-wide: the benchmark crate's Criterion
# dependency needs a newer compiler, and so does compio's buffer crate behind the
# `completion` feature. The two numbers move independently: raising this is routine, raising
# the MSRV is a breaking change for anyone depending on the crate.
#
# rustup reads this file automatically, so `cargo test` in a clone uses it with no setup.
[toolchain]
channel = "1.95.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
