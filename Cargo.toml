[workspace]
resolver = "3"
members = [
    "crates/h3-ngnet-qmux",
    "crates/ngnet-axum",
    "crates/ngnet-h2",
    "crates/ngnet-h2-sys",
    "crates/ngnet-h3-sys",
    "crates/ngnet-h3",
    "crates/ngnet-h3-quinn",
    "crates/ngnet-quic-sys",
    "crates/ngnet-quic",
    "crates/ngnet-quic-h3",
    "crates/ngnet-qmux-sys",
    "crates/ngnet-qmux",
    "crates/ngnet-qmux-h3",
    "crates/ngnet-util",
    "tests/ngnet-h2-tests",
    "tests/ngnet-h3-tests",
    "tests/ngnet-quic-tests",
    "tests/ngnet-quic-h3-tests",
    "tests/ngnet-qmux-h3-tests",
    "tests/ngnet-bench",
    "tests/ngnet-workspace-tests",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/ngnet"

# Every dependency in the workspace is declared here and referenced with
# `workspace = true`, so a version is chosen once rather than per crate.
# Paths are relative to this file, not to the crate that uses them.
[workspace.dependencies]
# `default-features = false` is load-bearing rather than tidiness. Two of axum's default
# features pull in the very engine this integration replaces: `http1` enables `dep:hyper`,
# and `tokio` enables `dep:hyper-util`. With both off, a `Router` is just a `tower` service
# from an `http::Request` to an `http::Response`, which is all `ngnet-axum` needs and all it
# can use -- there is no HTTP/1 to serve over an h2c-only stack anyway.
#
# The cost is `ConnectInfo`, axum's peer-address extractor, which is gated behind that same
# `tokio` feature because upstream it is populated by hyper-util's listener. `ngnet-axum`
# supplies its own extension instead; see `crates/ngnet-axum/src/peer.rs` for why the
# substitution is not quite like for like.
axum = { version = "0.8", default-features = false }
bindgen = "0.72"
bytes = "1"
# Compiles the vendored dwnx sources for `ngnet-qmux-sys`. That crate is the only one here
# that needs a C compiler driver rather than `cmake`, because dwnx ships autotools and no
# CMakeLists.txt; see its build script for why compiling the sources directly is viable.
cc = "1"
# `io-uring` and deliberately *not* `polling`: with both, compio compiles a fusion driver
# that probes the kernel and silently falls back to epoll when io_uring cannot be obtained.
# A transport that quietly became readiness-based while still calling itself completion-based
# would make every measurement taken through it a lie, and pinning the driver at each call
# site cannot help a downstream user who builds their own runtime. With one backend compiled
# there is nothing to fall back to: the runtime uses io_uring or fails to start.
compio = { version = "0.19", default-features = false, features = [
    "bytes",
    "io",
    "io-uring",
    "net",
    "runtime",
] }
cmake = "0.1"
# `async_tokio` drives the async benches on a tokio runtime; the default features (HTML
# reports, `cargo bench` support) are kept so a saved baseline can be compared the usual way.
criterion = { version = "0.8", features = ["async_tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
# Upstream HTTP/3 stack used by the QMux adapter and as a benchmark comparison.
h3 = "0.0.8"
h3-quinn = "0.0.10"
# The comparison target. `client` and `server` give both conn builders; `http2` is the
# protocol under test; `http1` is off, so nothing HTTP/1 is pulled in.
hyper = { version = "1", features = ["client", "server", "http2"] }
# Only for the tokio glue the bench needs: `TokioExecutor` for hyper's http2 spawns and its
# own `TokioIo` stream adapter. Distinct from this crate's `TokioIo`; the bench aliases both.
hyper-util = { version = "0.1", features = ["tokio"] }
# The published crates carry a version alongside their path: cargo resolves the path for
# workspace builds and writes the version into the registry manifest at publish time, and
# refuses to publish a path dependency that has none.
ngnet-axum = { path = "crates/ngnet-axum" }
ngnet-h2 = { path = "crates/ngnet-h2", version = "0.0.1" }
ngnet-h2-sys = { path = "crates/ngnet-h2-sys", version = "0.0.1" }
ngnet-h3 = { path = "crates/ngnet-h3", version = "0.0.1" }
ngnet-h3-sys = { path = "crates/ngnet-h3-sys", version = "0.0.1" }
# The external-transport adapter: Quinn stays out of `ngnet-h3` while callers get a reusable
# implementation instead of copying the former integration-test backend.
ngnet-h3-quinn = { path = "crates/ngnet-h3-quinn" }
h3-ngnet-qmux = { path = "crates/h3-ngnet-qmux" }
ngnet-quic-sys = { path = "crates/ngnet-quic-sys", version = "0.0.1", default-features = false }
ngnet-quic = { path = "crates/ngnet-quic", version = "0.0.1" }
ngnet-quic-h3-tests = { path = "tests/ngnet-quic-h3-tests" }
# The QMux pair. Unrelated to the QUIC crates above despite the similar name: QMux is a
# different protocol over a different substrate, and a workspace test asserts neither family
# reaches the other.
ngnet-qmux-sys = { path = "crates/ngnet-qmux-sys" }
ngnet-qmux = { path = "crates/ngnet-qmux" }
# The two adapters for transport families implemented in this workspace. Keeping the joins
# here rather than in either side is what lets a caller take HTTP/3 without a transport
# implementation, or a transport without an HTTP/3 state machine; a workspace test asserts
# that neither transport family reaches the other.
ngnet-quic-h3 = { path = "crates/ngnet-quic-h3", version = "0.0.1" }
ngnet-qmux-h3 = { path = "crates/ngnet-qmux-h3" }
ngnet-util = { path = "crates/ngnet-util" }
# Build-time only, and only for the `crypto-ossl` feature of `ngnet-quic-sys`:
# it locates the system OpenSSL that ngtcp2's crypto helper is compiled against.
pkg-config = "0.3"
# The QUIC implementation used by the standalone `ngnet-h3-quinn` adapter and its integration
# tests. `ngnet-h3` itself still depends on nothing but its own `-sys` crate, and a test
# asserts as much.
#
# `platform-verifier` is off, and with it `rustls-native-certs`: the tests trust exactly one
# self-signed certificate they generated themselves, so reading the host's trust store would
# be dead weight and would make the result depend on the machine.
#
# rustls is deliberately *not* declared separately. quinn re-exports the copy it was built
# against, so a second declaration could drift to a different version and produce two
# incompatible `ServerConfig` types with identical names.
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "runtime-tokio",
    "rustls-ring",
] }
rcgen = "0.14"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    # `mpsc`, which the HTTP/3 harness uses to get bytes from its per-stream reader tasks
    # back to the connection driver.
    "sync",
    "time",
] }
# The trait that makes the axum integration possible, taken directly rather than through
# `tower`. axum does not re-export it, so `Router::call` cannot be named without declaring
# it here; and `tower` itself would add the combinator layer -- `ServiceBuilder`, retries,
# timeouts -- when what is wanted is the one trait definition those are all written against.
# Same trait either way: `tower::Service` *is* `tower_service::Service`.
tower-service = "0.3"
