[workspace]
resolver = "3"
members = ["crates/nghttp2", "crates/nghttp2-sys", "crates/nghttp2-tests"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/ngrs"
rust-version = "1.85"

# Every dependency in the workspace is declared here and referenced with
# `workspace = true`, so a version is chosen once rather than per crate.
# Paths are relative to this file, not to the crate that uses them.
[workspace.dependencies]
bindgen = "0.72"
bytes = "1"
# `polling` rather than the default `io-uring`: what is being proven is that the transport
# traits fit a completion API, and the epoll-backed driver presents the same completion
# shape while running anywhere. Environments with io_uring can swap the feature.
compio = { version = "0.19", default-features = false, features = [
    "bytes",
    "io",
    "net",
    "polling",
    "runtime",
] }
cmake = "0.1"
http = "1"
http-body = "1"
nghttp2 = { path = "crates/nghttp2" }
nghttp2-sys = { path = "crates/nghttp2-sys" }
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "time",
] }
