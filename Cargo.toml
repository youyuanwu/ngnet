[workspace]
resolver = "3"
members = [
    "crates/ngnet-h2",
    "crates/ngnet-h2-sys",
    "crates/ngnet-h2-tests",
    "crates/ngnet-h2-bench",
    "crates/ngnet-h3-sys",
    "crates/ngnet-h3",
    "crates/ngnet-h3-tests",
    "crates/ngnet-quic-sys",
    "crates/ngnet-quic",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/ngnet"

# Every dependency in the workspace is declared here and referenced with
# `workspace = true`, so a version is chosen once rather than per crate.
# Paths are relative to this file, not to the crate that uses them.
[workspace.dependencies]
bindgen = "0.72"
bytes = "1"
# `io-uring` and deliberately *not* `polling`: with both, compio compiles a fusion driver
# that probes the kernel and silently falls back to epoll when io_uring cannot be obtained.
# A transport that quietly became readiness-based while still calling itself completion-based
# would make every measurement taken through it a lie, and pinning the driver at each call
# site cannot help a downstream user who builds their own runtime. With one backend compiled
# there is nothing to fall back to: the runtime uses io_uring or fails to start.
compio = { version = "0.19", default-features = false, features = [
    "bytes",
    "io",
    "io-uring",
    "net",
    "runtime",
] }
cmake = "0.1"
# `async_tokio` drives the async benches on a tokio runtime; the default features (HTML
# reports, `cargo bench` support) are kept so a saved baseline can be compared the usual way.
criterion = { version = "0.8", features = ["async_tokio"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
# The comparison target. `client` and `server` give both conn builders; `http2` is the
# protocol under test; `http1` is off, so nothing HTTP/1 is pulled in.
hyper = { version = "1", features = ["client", "server", "http2"] }
# Only for the tokio glue the bench needs: `TokioExecutor` for hyper's http2 spawns and its
# own `TokioIo` stream adapter. Distinct from this crate's `TokioIo`; the bench aliases both.
hyper-util = { version = "0.1", features = ["tokio"] }
ngnet-h2 = { path = "crates/ngnet-h2" }
ngnet-h2-sys = { path = "crates/ngnet-h2-sys" }
ngnet-h3 = { path = "crates/ngnet-h3" }
ngnet-h3-sys = { path = "crates/ngnet-h3-sys" }
ngnet-quic-sys = { path = "crates/ngnet-quic-sys", default-features = false }
ngnet-quic = { path = "crates/ngnet-quic" }
# Build-time only, and only for the `crypto-ossl` feature of `ngnet-quic-sys`:
# it locates the system OpenSSL that ngtcp2's crypto helper is compiled against.
pkg-config = "0.3"
# The QUIC implementation the HTTP/3 integration tests run over. Test-only: `ngnet-h3`
# itself depends on nothing but its own `-sys` crate, and a test asserts as much.
#
# `platform-verifier` is off, and with it `rustls-native-certs`: the tests trust exactly one
# self-signed certificate they generated themselves, so reading the host's trust store would
# be dead weight and would make the result depend on the machine.
#
# rustls is deliberately *not* declared separately. quinn re-exports the copy it was built
# against, so a second declaration could drift to a different version and produce two
# incompatible `ServerConfig` types with identical names.
quinn = { version = "0.11", default-features = false, features = [
    "log",
    "runtime-tokio",
    "rustls-ring",
] }
rcgen = "0.14"
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    # `mpsc`, which the HTTP/3 harness uses to get bytes from its per-stream reader tasks
    # back to the connection driver.
    "sync",
    "time",
] }
