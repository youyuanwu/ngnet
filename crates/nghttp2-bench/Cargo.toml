[package]
name = "nghttp2-bench"
version = "0.1.0"
description = "Criterion benchmarks comparing the nghttp2 async HTTP/2 stack against hyper over an in-memory duplex"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate exists so the comparison against a third-party HTTP/2 stack lives outside
# `nghttp2`, which takes exactly one dependency and no dev-dependencies. Everything the
# benches need is declared in the workspace and pulled in here, never there.
[dependencies]
# The `tokio` feature supplies this crate's own `TokioIo` transport adapter; `completion`
# supplies `CompioIo`, the io_uring transport the second benchmark family measures. Both
# adapters ship in `nghttp2`; this crate only enables them.
nghttp2 = { workspace = true, features = ["tokio", "completion"] }
tokio.workspace = true
# The completion runtime under test. Its `criterion` feature adds the `AsyncExecutor` impl
# for compio's `Runtime`, so `b.to_async(&compio_runtime)` drives it exactly as the tokio
# benches drive a tokio runtime.
compio = { workspace = true, features = ["criterion"] }

bytes.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true

[dev-dependencies]
criterion.workspace = true

# `harness = false` on each bench hands the whole `main` to Criterion rather than to
# libtest, which is what lets Criterion time and report the iterations itself.
[[bench]]
name = "serial_latency"
harness = false

[[bench]]
name = "concurrent_throughput"
harness = false

[[bench]]
name = "body_throughput"
harness = false

# The completion-vs-readiness family. Same three measures as above, but holding the HTTP/2
# stack constant and varying only the transport: `CompioSocket` on io_uring against
# `TokioSocket` on epoll, over a real loopback socket.
[[bench]]
name = "transport_serial_latency"
harness = false

[[bench]]
name = "transport_concurrent_throughput"
harness = false

[[bench]]
name = "transport_body_throughput"
harness = false
