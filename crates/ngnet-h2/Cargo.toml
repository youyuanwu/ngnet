[package]
name = "ngnet-h2"
version = "0.0.1"
description = "Safe, sans-I/O Rust bindings to libnghttp2 for cleartext HTTP/2 (h2c)"
readme = "README.md"
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The async `http` layer is the headline API, so it is on by default. Disabling it
# returns the crate to a sans-I/O state machine with exactly one dependency.
default = ["http"]
http = ["dep:bytes", "dep:http", "dep:http-body"]
# A ready-made transport for tokio. Off by default: a caller on another runtime should not
# pay for this one, and writing a transport for an unsupported runtime is a small job.
tokio = ["http", "dep:tokio"]
# A ready-made transport for compio, over io_uring. Off by default for the same reason, and
# additionally because it compiles no readiness backend: enabling it on a host without
# io_uring gets a runtime that fails to start rather than one that quietly uses epoll.
#
# This feature needs a newer compiler than the rest of the workspace would. compio's
# buffer crate is the reason, and pinning compio back far enough to reach
# it would mean an ancient io_uring stack. The baseline applies to the crate as published —
# default and `tokio` builds honour it — and enabling this feature opts into a newer
# compiler, which is why it is off by default.
completion = ["http", "dep:compio"]

# Exactly one *non-optional* dependency. A test fails the build if that grows, and
# requires every optional one to be reachable only through a declared feature.
[dependencies]
ngnet-h2-sys.workspace = true

bytes = { workspace = true, optional = true }
compio = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[[example]]
name = "h2c_async_server"
required-features = ["tokio"]
