[package]
name = "ngnet-h2-tests"
version = "0.1.0"
description = "Integration tests driving the ngnet-h2 crate over real asynchronous transports"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate exists so that an async runtime can be exercised against `ngnet-h2` without
# the wrapper itself acquiring a dependency on one. `ngnet-h2` has exactly one dependency
# and no dev-dependencies, and a test asserts as much; anything needing more belongs here.
[features]
# Exercises the shipped compio transport over a real io_uring socket. Off by default
# because it requires io_uring: the crate compiles no readiness backend, so running is the
# bar rather than compiling, and a host without io_uring fails rather than quietly using
# epoll while still calling itself completion-based.
completion = ["dep:compio", "ngnet-h2/completion"]

[dependencies]
ngnet-h2 = { workspace = true, features = ["tokio"] }
tokio.workspace = true

bytes.workspace = true
http.workspace = true
http-body.workspace = true

compio = { workspace = true, optional = true }
