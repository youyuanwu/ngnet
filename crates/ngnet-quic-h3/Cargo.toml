[package]
name = "ngnet-quic-h3"
version = "0.0.1"
description = "HTTP/3 over ngtcp2: an ngnet-h3 transport backed by ngnet-quic"
readme = "README.md"
# Released at 0.0.x alongside the two crates it binds, and cannot move past them: both APIs
# are still expected to change. See `docs/quic-h3/pending-work.md`.
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Additive and deliberately non-default. The implementation delegates storage to
# `ngnet-quic`, so one arming state covers transport, endpoint, and adapter observations.
diagnostics = ["ngnet-quic/diagnostics"]

[dependencies]
ngnet-h3.workspace = true
ngnet-quic.workspace = true
bytes.workspace = true
