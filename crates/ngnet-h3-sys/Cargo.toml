[package]
name = "ngnet-h3-sys"
version = "0.1.0"
description = "Low level FFI bindings to libnghttp3, built from the vendored nghttp3 submodule"
edition.workspace = true
license.workspace = true
repository.workspace = true

# Declares that this crate links the native `nghttp3` library, so cargo will
# refuse to link two copies of it into the same binary.
links = "nghttp3"
build = "build.rs"

[lib]
# bindgen carries the C doc comments over verbatim, and their C code samples
# are not valid Rust, so they must not be run as doctests.
doctest = false

[build-dependencies]
cmake.workspace = true
bindgen.workspace = true
