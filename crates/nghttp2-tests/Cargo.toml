[package]
name = "nghttp2-tests"
version = "0.1.0"
description = "Integration tests driving the nghttp2 crate over real asynchronous transports"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate exists so that an async runtime can be exercised against `nghttp2` without
# the wrapper itself acquiring a dependency on one. `nghttp2` has exactly one dependency
# and no dev-dependencies, and a test asserts as much; anything needing more belongs here.
[dependencies]
nghttp2.workspace = true
tokio.workspace = true
