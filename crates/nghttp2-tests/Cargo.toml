[package]
name = "nghttp2-tests"
version = "0.1.0"
description = "Integration tests driving the nghttp2 crate over real asynchronous transports"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# This crate exists so that an async runtime can be exercised against `nghttp2` without
# the wrapper itself acquiring a dependency on one. `nghttp2` has exactly one dependency
# and no dev-dependencies, and a test asserts as much; anything needing more belongs here.
[features]
# Compiles the async layer's transport traits against a real completion-based runtime.
# Off by default because io_uring is not available everywhere, and compiling is the bar:
# what is being proven is that the traits *fit* a completion API — its buffer types and its
# thread-per-core executor included — not that this machine can run one.
completion = ["dep:compio"]

[dependencies]
nghttp2 = { workspace = true, features = ["tokio"] }
tokio.workspace = true

bytes.workspace = true
http.workspace = true
http-body.workspace = true

compio = { workspace = true, optional = true }
