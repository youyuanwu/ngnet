[package]
name = "ngnet-h3"
version = "0.0.1"
description = "Safe, sans-I/O Rust bindings to libnghttp3 for HTTP/3 framing and QPACK"
readme = "README.md"
# Released at 0.0.x alongside `ngnet-h3-sys`, deliberately below 0.1: the API is still
# expected to change -- see `docs/h3/pending-work.md` -- and a leading zero minor is the
# only version range cargo treats as breaking on every bump.
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The async `http` layer is the headline API for a caller who wants HTTP/3 rather than a
# state machine, so it is on by default. Disabling it returns the crate to a sans-I/O state
# machine with exactly one dependency and no asynchrony of its own.
default = ["http"]
http = ["dep:bytes", "dep:http", "dep:http-body"]

# Exactly one *non-optional* dependency. A test fails the build if that grows, and requires
# every optional one to be reachable only through a declared feature.
[dependencies]
ngnet-h3-sys.workspace = true

bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body = { workspace = true, optional = true }
