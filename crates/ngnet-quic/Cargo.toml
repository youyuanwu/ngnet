[package]
name = "ngnet-quic"
version = "0.1.0"
description = "Safe, sans-I/O Rust bindings to libngtcp2 for QUIC transport"
# The QUIC stack is not ready to be released: see `docs/quic/pending-work.md`. Publishing
# would fix a public API that is still expected to change, so the crate is withheld until it
# is. Remove this line, and the same line in `ngnet-quic-sys`, to release the pair together --
# a published crate cannot depend on an unpublished one.
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# The OpenSSL TLS backend is on by default, because a QUIC connection without a TLS
# backend cannot complete a handshake and so cannot do anything a caller wants. Turning it
# off leaves the `TlsBackend` seam in place with no implementation behind it, for a caller
# supplying their own.
#
# This maps onto the sys crate's own feature rather than merely gating Rust code: with
# `crypto-ossl` off, `ngnet-quic-sys` builds no crypto helper archive and its `wrapper.h`
# does not include the crypto headers, so no `ngtcp2_crypto_*` symbol exists to call.
default = ["tls-ossl"]
tls-ossl = ["ngnet-quic-sys/crypto-ossl"]

# Exactly one *non-optional* dependency, as in `ngnet-h2` and `ngnet-h3`. A test fails the
# build if that grows, and requires every optional one to be reachable only through a
# declared feature.
#
# `default-features = false` on the workspace entry above is load-bearing rather than
# tidiness. The sys crate defaults `crypto-ossl` on, and inheriting that would link libssl
# into a build this crate was asked to make without TLS -- the one thing
# `--no-default-features` is for. The `tls-ossl` feature above is what turns it back on, so
# the decision is made here rather than inherited silently. (Cargo forbids a member from
# overriding an inherited `default-features`, which is why the flag lives in the workspace
# table and not on this line.)
[dependencies]
ngnet-quic-sys = { workspace = true }
